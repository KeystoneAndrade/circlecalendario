<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>Circle Calendário</title>
<style>
  :root {
    --bg: #0b0e14;
    --face: #11151d;
    --face-2: #161b25;
    --ring: #1f2633;
    --text: #e7ecf3;
    --muted: #7c8699;
    --accent: #ffb86b;

    --day:   rgba(255, 220, 150, 0.06);
    --night: rgba(80, 100, 160, 0.16);

    --hand-hour:   rgba(255, 255, 255, 0.85);
    --hand-minute: rgba(220, 225, 235, 0.7);
    --hand-second: #ff5d73;

    --shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #141a26 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
    min-height: 100svh;
  }

  header {
    width: 100%;
    padding: 14px 20px 4px;
    text-align: center;
    flex-shrink: 0;
  }
  .date-main { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
  .weekday   { font-size: 12px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 2px; }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    min-height: 0;
  }

  .clock {
    width: min(92vw, 88svh, 560px);
    aspect-ratio: 1 / 1;
    position: relative;
    filter: drop-shadow(var(--shadow));
    touch-action: manipulation;
  }
  svg.clock-face { width: 100%; height: 100%; display: block; }

  .hour-label {
    font-size: 3.4px;
    fill: var(--muted);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 500;
  }
  .hour-label.major { font-size: 4.2px; fill: var(--text); font-weight: 600; }

  .tick       { stroke: rgba(255, 255, 255, 0.18); }
  .tick-major { stroke: rgba(255, 255, 255, 0.5); }

  .event-arc {
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
    transform-origin: 50px 50px;
  }
  .event-arc:active { opacity: 0.7; }
  .event-label {
    font-size: 2.8px;
    fill: rgba(0, 0, 0, 0.85);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 700;
    pointer-events: none;
    letter-spacing: 0.2px;
  }

  .hand-hour   { stroke: var(--hand-hour);   stroke-linecap: round; }
  .hand-minute { stroke: var(--hand-minute); stroke-linecap: round; }
  .hand-second { stroke: var(--hand-second); stroke-linecap: round; }

  .center-dot  { fill: var(--text); }
  .center-ring { fill: none; stroke: var(--ring); }

  footer {
    width: 100%;
    padding: 6px 16px 16px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .time-display {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .controls button {
    background: var(--face-2);
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    min-width: 44px;
    min-height: 36px;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .controls button:active { background: var(--ring); transform: scale(0.97); }
  .controls .today-btn { color: var(--accent); border-color: var(--accent); background: transparent; }
  .controls .add-btn {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    padding: 8px 16px;
  }

  /* Sheet (modal) */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #141925;
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 11;
    max-height: 90svh;
    overflow-y: auto;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 38px;
    height: 4px;
    background: var(--ring);
    border-radius: 2px;
    margin: 0 auto 12px;
  }

  .sheet-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    text-align: center;
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .form-row label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .form-row input[type="text"],
  .form-row input[type="time"] {
    width: 100%;
    background: var(--face);
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-row input:focus { outline: none; border-color: var(--accent); }

  .time-row { display: flex; gap: 10px; }
  .time-row .form-row { flex: 1; margin-bottom: 0; }

  .color-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
  }
  .color-swatch {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .color-swatch.selected {
    border-color: var(--text);
    transform: scale(1.1);
  }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .sheet-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    min-height: 44px;
    border: 1px solid transparent;
  }
  .btn-cancel { background: transparent; color: var(--muted); border-color: var(--ring); }
  .btn-save   { background: var(--accent); color: var(--bg); }
  .btn-delete { background: transparent; color: #ff5d73; border-color: #ff5d73; }
  .sheet-actions button:active { transform: scale(0.98); }

  .empty-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    min-height: 14px;
  }

  @media (max-height: 640px) {
    header { padding: 8px 20px 2px; }
    .date-main { font-size: 17px; }
    .weekday { font-size: 10px; margin-top: 2px; }
    footer { padding: 4px 16px 10px; gap: 6px; }
    .time-display { font-size: 18px; }
    .clock { width: min(82vw, 78svh, 380px); }
  }
</style>
</head>
<body>
  <header>
    <div class="date-main" id="dateMain">—</div>
    <div class="weekday" id="weekday">—</div>
  </header>

  <main>
    <div class="clock">
      <svg class="clock-face" viewBox="0 0 100 100" id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%"  stop-color="#1c2330"/>
            <stop offset="100%" stop-color="#0e131c"/>
          </radialGradient>
        </defs>

        <circle cx="50" cy="50" r="49" fill="url(#faceGrad)" stroke="#1f2633" stroke-width="0.4"/>

        <g id="zones"></g>
        <g id="ticks"></g>
        <g id="hourLabels"></g>
        <g id="events"></g>

        <line id="handHour"   class="hand-hour"   x1="50" y1="50" x2="50" y2="50" stroke-width="1.4"/>
        <line id="handMinute" class="hand-minute" x1="50" y1="50" x2="50" y2="50" stroke-width="0.9"/>
        <line id="handSecond" class="hand-second" x1="50" y1="50" x2="50" y2="50" stroke-width="0.35"/>

        <circle class="center-ring" cx="50" cy="50" r="2" stroke-width="0.4"/>
        <circle class="center-dot"  cx="50" cy="50" r="1"/>
      </svg>
    </div>
  </main>

  <footer>
    <div class="time-display" id="timeDisplay">--:--:--</div>
    <div class="empty-hint" id="emptyHint"></div>
    <div class="controls">
      <button id="prevBtn" aria-label="Dia anterior">‹</button>
      <button class="today-btn" id="todayBtn">Hoje</button>
      <button class="add-btn"   id="addBtn"   aria-label="Adicionar evento">+</button>
      <button id="nextBtn" aria-label="Próximo dia">›</button>
    </div>
  </footer>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Novo evento</div>

    <div class="form-row">
      <label for="evTitle">Título</label>
      <input type="text" id="evTitle" maxlength="40" placeholder="Ex: Reunião, Almoço, Estudo..." />
    </div>

    <div class="time-row">
      <div class="form-row">
        <label for="evStart">Início</label>
        <input type="time" id="evStart" />
      </div>
      <div class="form-row">
        <label for="evEnd">Fim</label>
        <input type="time" id="evEnd" />
      </div>
    </div>

    <div class="form-row">
      <label>Cor</label>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancel">Cancelar</button>
      <button class="btn-delete" id="btnDelete" style="display:none">Excluir</button>
      <button class="btn-save"   id="btnSave">Salvar</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const WEEKDAYS_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MONTHS_PT   = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  const COLORS = [
    '#ef4444', '#f97316', '#eab308', '#22c55e',
    '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'
  ];

  const STORAGE_KEY = 'circleCalendar.events.v1';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 50, CY = 50;

  // ---------- DOM ----------
  const zonesG    = document.getElementById('zones');
  const ticksG    = document.getElementById('ticks');
  const hoursG    = document.getElementById('hourLabels');
  const eventsG   = document.getElementById('events');

  const handHour  = document.getElementById('handHour');
  const handMin   = document.getElementById('handMinute');
  const handSec   = document.getElementById('handSecond');

  const dateMainEl  = document.getElementById('dateMain');
  const weekdayEl   = document.getElementById('weekday');
  const timeEl      = document.getElementById('timeDisplay');
  const emptyHintEl = document.getElementById('emptyHint');

  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const todayBtn = document.getElementById('todayBtn');
  const addBtn   = document.getElementById('addBtn');

  const backdrop  = document.getElementById('backdrop');
  const sheet     = document.getElementById('sheet');
  const sheetTitle= document.getElementById('sheetTitle');
  const evTitle   = document.getElementById('evTitle');
  const evStart   = document.getElementById('evStart');
  const evEnd     = document.getElementById('evEnd');
  const colorGrid = document.getElementById('colorGrid');
  const btnCancel = document.getElementById('btnCancel');
  const btnSave   = document.getElementById('btnSave');
  const btnDelete = document.getElementById('btnDelete');

  // ---------- Estado ----------
  const today = startOfDay(new Date());
  let viewDate = new Date(today.getTime());
  let events = loadEvents();
  let editingId = null;
  let selectedColor = COLORS[5];

  function startOfDay(d) {
    const x = new Date(d.getTime());
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function dateKey(d) {
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isViewingToday() {
    return viewDate.getTime() === today.getTime();
  }

  // ---------- Storage ----------
  function loadEvents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveEvents() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); } catch (e) {}
  }

  // ---------- Geometria ----------
  function hourToAngle(hour) { return (hour / 24) * 360; }
  function polar(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  function arcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
    let a1 = startAngle, a2 = endAngle;
    if (a2 - a1 >= 360) a2 = a1 + 359.99;
    const largeArc = (a2 - a1) > 180 ? 1 : 0;
    const p1 = polar(cx, cy, rOuter, a1);
    const p2 = polar(cx, cy, rOuter, a2);
    const p3 = polar(cx, cy, rInner, a2);
    const p4 = polar(cx, cy, rInner, a1);
    return [
      'M', p1.x, p1.y,
      'A', rOuter, rOuter, 0, largeArc, 1, p2.x, p2.y,
      'L', p3.x, p3.y,
      'A', rInner, rInner, 0, largeArc, 0, p4.x, p4.y,
      'Z'
    ].join(' ');
  }
  function timeToHours(t) {
    if (!t) return 0;
    const [h, m] = t.split(':').map(Number);
    return h + (m || 0) / 60;
  }
  function hoursToTime(h) {
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    const pad = (n) => String(n).padStart(2, '0');
    return pad(hh) + ':' + pad(mm);
  }

  // ---------- Construção estática ----------
  function buildZones() {
    zonesG.innerHTML = '';
    // Dia: 06–18 ; Noite: 18–06
    const day   = document.createElementNS(SVG_NS, 'path');
    day.setAttribute('d', arcPath(CX, CY, 48, 12, hourToAngle(6), hourToAngle(18)));
    day.setAttribute('fill', 'var(--day)');
    zonesG.appendChild(day);

    const night = document.createElementNS(SVG_NS, 'path');
    night.setAttribute('d', arcPath(CX, CY, 48, 12, hourToAngle(18), hourToAngle(30))); // 18 -> 06 (next day)
    night.setAttribute('fill', 'var(--night)');
    zonesG.appendChild(night);
  }

  function buildTicksAndHours() {
    ticksG.innerHTML = '';
    hoursG.innerHTML = '';

    for (let i = 0; i < 24; i++) {
      const angle = hourToAngle(i);
      const major = i % 6 === 0;
      const r1 = major ? 44.5 : 45.5;
      const r2 = 47;
      const p1 = polar(CX, CY, r1, angle);
      const p2 = polar(CX, CY, r2, angle);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', p1.x);
      line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x);
      line.setAttribute('y2', p2.y);
      line.setAttribute('class', major ? 'tick tick-major' : 'tick');
      line.setAttribute('stroke-width', major ? 0.4 : 0.2);
      ticksG.appendChild(line);
    }

    // Números a cada 3h
    for (let h = 0; h < 24; h += 3) {
      const pos = polar(CX, CY, 42, hourToAngle(h));
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', pos.x);
      text.setAttribute('y', pos.y);
      const isMajor = (h % 6 === 0);
      text.setAttribute('class', 'hour-label' + (isMajor ? ' major' : ''));
      text.textContent = String(h).padStart(2, '0');
      hoursG.appendChild(text);
    }
  }

  // ---------- Eventos no relógio ----------
  function eventsForDate(d) {
    const key = dateKey(d);
    return events
      .filter(e => e.date === key)
      .sort((a, b) => timeToHours(a.start) - timeToHours(b.start));
  }

  // Algoritmo guloso de alocação de tracks (rings concêntricos)
  function assignTracks(list) {
    const tracks = []; // cada track é um array de eventos sem sobreposição
    list.forEach(ev => {
      const s = timeToHours(ev.start);
      const e = timeToHours(ev.end);
      let placed = false;
      for (let i = 0; i < tracks.length; i++) {
        const last = tracks[i][tracks[i].length - 1];
        if (timeToHours(last.end) <= s) {
          tracks[i].push(ev);
          ev._track = i;
          placed = true;
          break;
        }
      }
      if (!placed) {
        tracks.push([ev]);
        ev._track = tracks.length - 1;
      }
    });
    return tracks.length;
  }

  function renderEvents() {
    eventsG.innerHTML = '';
    const list = eventsForDate(viewDate);

    if (list.length === 0) {
      emptyHintEl.textContent = 'Toque em + para adicionar um evento';
    } else {
      emptyHintEl.textContent = list.length + (list.length === 1 ? ' evento' : ' eventos');
    }

    if (list.length === 0) return;

    const trackCount = assignTracks(list);
    const rOuterMax = 44;
    const rInnerMin = 14;
    const totalSpace = rOuterMax - rInnerMin;
    const trackWidth = Math.min(6, totalSpace / Math.max(trackCount, 1));
    const gap = 0.6;

    list.forEach(ev => {
      const s = timeToHours(ev.start);
      const e = timeToHours(ev.end);
      if (e <= s) return;

      const rOuter = rOuterMax - ev._track * trackWidth;
      const rInner = rOuter - trackWidth + gap;
      const a1 = hourToAngle(s);
      const a2 = hourToAngle(e);

      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', arcPath(CX, CY, rOuter, rInner, a1, a2));
      path.setAttribute('fill', ev.color);
      path.setAttribute('class', 'event-arc');
      path.setAttribute('data-id', ev.id);
      path.addEventListener('click', () => openSheet(ev));
      eventsG.appendChild(path);

      // Rótulo no meio do arco se houver espaço
      const arcDeg = a2 - a1;
      if (arcDeg >= 18 && (rOuter - rInner) >= 3.5) {
        const midAngle = (a1 + a2) / 2;
        const midR = (rOuter + rInner) / 2;
        const pos = polar(CX, CY, midR, midAngle);
        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('x', pos.x);
        text.setAttribute('y', pos.y);
        text.setAttribute('class', 'event-label');
        const maxChars = Math.max(4, Math.floor(arcDeg / 4));
        const title = ev.title.length > maxChars ? ev.title.slice(0, maxChars - 1) + '…' : ev.title;
        text.textContent = title;
        eventsG.appendChild(text);
      }
    });
  }

  // ---------- Ponteiros ----------
  function setHand(el, angleDeg, length) {
    const p = polar(CX, CY, length, angleDeg);
    el.setAttribute('x2', p.x);
    el.setAttribute('y2', p.y);
  }
  function updateHands() {
    if (!isViewingToday()) {
      handHour.style.display = 'none';
      handMin.style.display = 'none';
      handSec.style.display = 'none';
      return;
    }
    const now = new Date();
    const h = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
    const m = now.getMinutes() + now.getSeconds()/60;
    const s = now.getSeconds() + now.getMilliseconds()/1000;
    setHand(handHour, hourToAngle(h), 26);
    setHand(handMin,  (m / 60) * 360, 36);
    setHand(handSec,  (s / 60) * 360, 40);
    handHour.style.display = '';
    handMin.style.display = '';
    handSec.style.display = '';
  }

  function updateTime() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    if (isViewingToday()) {
      timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    } else {
      timeEl.textContent = '--:--:--';
    }
    updateHands();
  }

  function updateHeader() {
    const d = viewDate.getDate();
    const m = MONTHS_PT[viewDate.getMonth()];
    const y = viewDate.getFullYear();
    dateMainEl.textContent = d + ' de ' + m + ' de ' + y;
    weekdayEl.textContent = WEEKDAYS_PT[viewDate.getDay()] + (isViewingToday() ? ' · HOJE' : '');
  }

  function render() {
    updateHeader();
    renderEvents();
    updateTime();
  }

  // ---------- Sheet (criar/editar) ----------
  function buildColorGrid() {
    colorGrid.innerHTML = '';
    COLORS.forEach(c => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
      swatch.style.background = c;
      swatch.dataset.color = c;
      swatch.addEventListener('click', () => {
        selectedColor = c;
        [...colorGrid.children].forEach(el => el.classList.remove('selected'));
        swatch.classList.add('selected');
      });
      colorGrid.appendChild(swatch);
    });
  }

  function openSheet(existing) {
    if (existing) {
      editingId = existing.id;
      sheetTitle.textContent = 'Editar evento';
      evTitle.value = existing.title;
      evStart.value = existing.start;
      evEnd.value   = existing.end;
      selectedColor = existing.color;
      btnDelete.style.display = '';
    } else {
      editingId = null;
      sheetTitle.textContent = 'Novo evento';
      evTitle.value = '';
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const hh = isViewingToday() ? now.getHours() : 9;
      evStart.value = pad(hh) + ':00';
      evEnd.value   = pad(Math.min(hh + 1, 23)) + ':00';
      selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      btnDelete.style.display = 'none';
    }
    buildColorGrid();
    backdrop.classList.add('open');
    sheet.classList.add('open');
  }

  function closeSheet() {
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
    editingId = null;
  }

  function saveEvent() {
    const title = (evTitle.value || '').trim();
    const start = evStart.value;
    const end   = evEnd.value;
    if (!title) { evTitle.focus(); return; }
    if (!start || !end) return;
    if (timeToHours(end) <= timeToHours(start)) {
      alert('O horário de fim deve ser maior que o de início.');
      return;
    }
    if (editingId) {
      const ev = events.find(x => x.id === editingId);
      if (ev) {
        ev.title = title;
        ev.start = start;
        ev.end = end;
        ev.color = selectedColor;
      }
    } else {
      events.push({
        id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
        date: dateKey(viewDate),
        title, start, end,
        color: selectedColor
      });
    }
    saveEvents();
    closeSheet();
    render();
  }

  function deleteEvent() {
    if (!editingId) return;
    if (!confirm('Excluir este evento?')) return;
    events = events.filter(e => e.id !== editingId);
    saveEvents();
    closeSheet();
    render();
  }

  addBtn.addEventListener('click', () => openSheet(null));
  btnCancel.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  btnSave.addEventListener('click', saveEvent);
  btnDelete.addEventListener('click', deleteEvent);

  prevBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date(viewDate.getTime() - 86400000));
    render();
  });
  nextBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date(viewDate.getTime() + 86400000));
    render();
  });
  todayBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date());
    render();
  });

  // Swipe horizontal navega entre dias (ignora se for sobre um evento)
  let touchStartX = null, touchStartY = null, touchStartTarget = null;
  const clockEl = document.querySelector('.clock');
  clockEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTarget = e.target;
  }, { passive: true });
  clockEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40 &&
        !(touchStartTarget && touchStartTarget.classList && touchStartTarget.classList.contains('event-arc'))) {
      if (dx < 0) nextBtn.click(); else prevBtn.click();
    }
    touchStartX = touchStartY = touchStartTarget = null;
  });

  // ---------- Bootstrap ----------
  buildZones();
  buildTicksAndHours();
  render();

  setInterval(updateTime, 1000);

  // Virada de dia
  setInterval(() => {
    const newToday = startOfDay(new Date());
    if (newToday.getTime() !== today.getTime()) {
      today.setTime(newToday.getTime());
      render();
    }
  }, 30000);
})();
</script>
</body>
</html>
