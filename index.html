<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>Circle Calendário</title>
<style>
  :root {
    --bg: #0b0e14;
    --face: #11151d;
    --face-2: #161b25;
    --ring: #1f2633;
    --text: #e7ecf3;
    --muted: #7c8699;
    --accent: #ffb86b;

    --day-tint:   rgba(255, 220, 150, 0.06);
    --night-tint: rgba(80, 110, 180, 0.13);
    --day-edge:   rgba(255, 220, 150, 0.18);
    --night-edge: rgba(120, 145, 200, 0.22);

    --hand-hour:   rgba(255, 255, 255, 0.95);
    --hand-minute: rgba(220, 225, 235, 0.8);
    --hand-second: #ff5d73;

    --shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #141a26 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
  }

  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh; min-height: 100svh;
  }

  header { width: 100%; padding: 16px 20px 6px; text-align: center; flex-shrink: 0; }
  .date-main { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
  .weekday { font-size: 12px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 2px; }

  main {
    flex: 1; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 14px; min-height: 0;
  }

  .clock {
    width: min(94vw, 88svh, 580px);
    aspect-ratio: 1 / 1;
    position: relative;
    filter: drop-shadow(var(--shadow));
    touch-action: manipulation;
  }
  svg.clock-face { width: 100%; height: 100%; display: block; }

  .hour-label {
    font-size: 5px;
    fill: var(--text);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 600;
  }
  .hour-label.major { font-size: 6px; }

  .tick       { stroke: rgba(255, 255, 255, 0.22); }
  .tick-major { stroke: rgba(255, 255, 255, 0.55); }

  .ring-bg-day   { fill: var(--day-tint);   stroke: var(--day-edge);   stroke-width: 0.15; }
  .ring-bg-night { fill: var(--night-tint); stroke: var(--night-edge); stroke-width: 0.15; }

  .zone-icon { fill: var(--muted); opacity: 0.55; font-size: 4px; text-anchor: middle; dominant-baseline: middle; }

  .event-arc { cursor: pointer; transition: opacity 0.15s ease; }
  .event-arc:active { opacity: 0.7; }
  .event-label {
    font-size: 3px;
    fill: rgba(0, 0, 0, 0.88);
    font-weight: 700;
    pointer-events: none;
    letter-spacing: 0.3px;
  }
  .event-label.light { fill: rgba(255, 255, 255, 0.95); }

  .hand-hour   { stroke: var(--hand-hour);   stroke-linecap: round; }
  .hand-minute { stroke: var(--hand-minute); stroke-linecap: round; }
  .hand-second { stroke: var(--hand-second); stroke-linecap: round; }

  .center-dot  { fill: var(--text); }
  .center-ring { fill: none; stroke: var(--ring); }

  footer {
    width: 100%;
    padding: 8px 16px 16px;
    flex-shrink: 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
  }
  .time-display {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    min-height: 28px;
  }
  .empty-hint { font-size: 11px; color: var(--muted); text-align: center; min-height: 14px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .controls button {
    background: var(--face-2);
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    min-width: 44px;
    min-height: 36px;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .controls button:active { background: var(--ring); transform: scale(0.97); }
  .controls .today-btn { color: var(--accent); border-color: var(--accent); background: transparent; }
  .controls .add-btn {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 700;
    font-size: 18px;
    line-height: 1;
    padding: 8px 16px;
  }

  /* Sheet */
  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #141925;
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 11;
    max-height: 90svh;
    overflow-y: auto;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle { width: 38px; height: 4px; background: var(--ring); border-radius: 2px; margin: 0 auto 12px; }
  .sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; text-align: center; }

  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .form-row label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
  .form-row input[type="text"], .form-row input[type="time"] {
    width: 100%; background: var(--face); color: var(--text);
    border: 1px solid var(--ring); border-radius: 10px;
    padding: 11px 12px; font-size: 15px; font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .form-row input:focus { outline: none; border-color: var(--accent); }
  .time-row { display: flex; gap: 10px; }
  .time-row .form-row { flex: 1; margin-bottom: 0; }

  .color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .color-swatch {
    aspect-ratio: 1 / 1; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .color-swatch.selected { border-color: var(--text); transform: scale(1.1); }

  .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
  .sheet-actions button {
    flex: 1; padding: 12px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    min-height: 44px; border: 1px solid transparent;
  }
  .btn-cancel { background: transparent; color: var(--muted); border-color: var(--ring); }
  .btn-save   { background: var(--accent); color: var(--bg); }
  .btn-delete { background: transparent; color: #ff5d73; border-color: #ff5d73; }
  .sheet-actions button:active { transform: scale(0.98); }

  @media (max-height: 700px) {
    header { padding: 8px 20px 2px; }
    .date-main { font-size: 17px; }
    .weekday { font-size: 10px; margin-top: 2px; }
    footer { padding: 4px 16px 10px; gap: 6px; }
    .time-display { font-size: 18px; }
    .clock { width: min(86vw, 76svh, 420px); }
  }
</style>
</head>
<body>
  <header>
    <div class="date-main" id="dateMain">—</div>
    <div class="weekday" id="weekday">—</div>
  </header>

  <main>
    <div class="clock">
      <svg class="clock-face" viewBox="0 0 100 100" id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="40%" r="70%">
            <stop offset="0%"  stop-color="#1c2230"/>
            <stop offset="100%" stop-color="#0c111a"/>
          </radialGradient>
          <!-- Anel externo: tinte quente (dia) -->
          <radialGradient id="dayRingGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(255,200,120,0)"/>
            <stop offset="100%" stop-color="rgba(255,200,120,0.18)"/>
          </radialGradient>
          <!-- Anel interno: tinte fria (noite) -->
          <radialGradient id="nightRingGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(90,120,200,0.22)"/>
            <stop offset="100%" stop-color="rgba(90,120,200,0)"/>
          </radialGradient>
        </defs>

        <circle cx="50" cy="50" r="49" fill="url(#faceGrad)" stroke="#1f2633" stroke-width="0.4"/>

        <!-- Anéis de fundo (dia externo, noite interno) -->
        <g id="ringBackgrounds"></g>

        <!-- Ícones discretos de sol/lua nas posições 12 (topo) e 6 (fundo) -->
        <g id="zoneIcons"></g>

        <g id="ticks"></g>
        <g id="hourLabels"></g>

        <g id="textPaths"></g>
        <g id="events"></g>

        <line id="handHour"   class="hand-hour"   x1="50" y1="50" x2="50" y2="50" stroke-width="1.4"/>
        <line id="handMinute" class="hand-minute" x1="50" y1="50" x2="50" y2="50" stroke-width="0.9"/>
        <line id="handSecond" class="hand-second" x1="50" y1="50" x2="50" y2="50" stroke-width="0.35"/>

        <circle class="center-ring" cx="50" cy="50" r="2" stroke-width="0.4"/>
        <circle class="center-dot"  cx="50" cy="50" r="1"/>
      </svg>
    </div>
  </main>

  <footer>
    <div class="time-display" id="timeDisplay">--:--:--</div>
    <div class="empty-hint" id="emptyHint"></div>
    <div class="controls">
      <button id="prevBtn" aria-label="Dia anterior">‹</button>
      <button class="today-btn" id="todayBtn">Hoje</button>
      <button class="add-btn"   id="addBtn"   aria-label="Adicionar evento">+</button>
      <button id="nextBtn" aria-label="Próximo dia">›</button>
    </div>
  </footer>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Novo evento</div>

    <div class="form-row">
      <label for="evTitle">Título</label>
      <input type="text" id="evTitle" maxlength="40" placeholder="Ex: Reunião, Almoço, Estudo..." />
    </div>

    <div class="time-row">
      <div class="form-row"><label for="evStart">Início</label><input type="time" id="evStart" /></div>
      <div class="form-row"><label for="evEnd">Fim</label><input type="time" id="evEnd" /></div>
    </div>

    <div class="form-row">
      <label>Cor</label>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancel">Cancelar</button>
      <button class="btn-delete" id="btnDelete" style="display:none">Excluir</button>
      <button class="btn-save"   id="btnSave">Salvar</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  const WEEKDAYS_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MONTHS_PT   = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];

  const STORAGE_KEY = 'circleCalendar.events.v3';
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 50, CY = 50;

  // Zonas dos anéis (radii)
  const DAY_RING   = { rMin: 27, rMax: 40 };
  const NIGHT_RING = { rMin:  8, rMax: 23 };
  const TRACK_GAP  = 0.6;
  const MAX_TRACK_WIDTH = 6.2;

  // ---------- DOM ----------
  const ticksG       = document.getElementById('ticks');
  const hoursG       = document.getElementById('hourLabels');
  const eventsG      = document.getElementById('events');
  const textPathsG   = document.getElementById('textPaths');
  const ringBgsG     = document.getElementById('ringBackgrounds');
  const zoneIconsG   = document.getElementById('zoneIcons');

  const handHour = document.getElementById('handHour');
  const handMin  = document.getElementById('handMinute');
  const handSec  = document.getElementById('handSecond');

  const dateMainEl  = document.getElementById('dateMain');
  const weekdayEl   = document.getElementById('weekday');
  const timeEl      = document.getElementById('timeDisplay');
  const emptyHintEl = document.getElementById('emptyHint');

  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const todayBtn = document.getElementById('todayBtn');
  const addBtn   = document.getElementById('addBtn');

  const backdrop  = document.getElementById('backdrop');
  const sheet     = document.getElementById('sheet');
  const sheetTitle= document.getElementById('sheetTitle');
  const evTitle   = document.getElementById('evTitle');
  const evStart   = document.getElementById('evStart');
  const evEnd     = document.getElementById('evEnd');
  const colorGrid = document.getElementById('colorGrid');
  const btnCancel = document.getElementById('btnCancel');
  const btnSave   = document.getElementById('btnSave');
  const btnDelete = document.getElementById('btnDelete');

  // ---------- Estado ----------
  const today = startOfDay(new Date());
  let viewDate = new Date(today.getTime());
  let events = loadEvents();
  let editingId = null;
  let selectedColor = COLORS[5];

  function startOfDay(d) {
    const x = new Date(d.getTime());
    x.setHours(0, 0, 0, 0);
    return x;
  }
  function dateKey(d) {
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function isViewingToday() { return viewDate.getTime() === today.getTime(); }

  // ---------- Storage ----------
  function loadEvents() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveEvents() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); } catch (e) {}
  }
  function timeToHours(t) {
    if (!t) return 0;
    const [h, m] = t.split(':').map(Number);
    return h + (m || 0) / 60;
  }

  // ---------- Geometria 12h ----------
  // Em um relógio de 12h: 12 no topo (0°), cresce horário. Hora H mapeia para (H % 12) * 30°.
  // Como o segmento de um evento é contíguo (até 12h), usamos ângulo desenrolado:
  //   startAngle = (startH % 12) * 30
  //   endAngle   = startAngle + (endH - startH) * 30   (pode passar de 360°, ok)
  function hourSpanToAngles(startH, endH) {
    const a1 = (startH % 12) * 30;
    const a2 = a1 + (endH - startH) * 30;
    return [a1, a2];
  }
  function polar(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  // Anel completo (rosquinha)
  function donutPath(cx, cy, rOuter, rInner) {
    const p1 = polar(cx, cy, rOuter, 0);
    const p2 = polar(cx, cy, rOuter, 180);
    const p3 = polar(cx, cy, rInner, 0);
    const p4 = polar(cx, cy, rInner, 180);
    return [
      'M', p1.x, p1.y,
      'A', rOuter, rOuter, 0, 1, 1, p2.x, p2.y,
      'A', rOuter, rOuter, 0, 1, 1, p1.x, p1.y,
      'M', p3.x, p3.y,
      'A', rInner, rInner, 0, 1, 0, p4.x, p4.y,
      'A', rInner, rInner, 0, 1, 0, p3.x, p3.y,
      'Z'
    ].join(' ');
  }
  function ringSegmentPath(cx, cy, rOuter, rInner, a1, a2) {
    let arcSpan = a2 - a1;
    if (arcSpan >= 360) arcSpan = 359.99;
    const largeArc = arcSpan > 180 ? 1 : 0;
    const p1 = polar(cx, cy, rOuter, a1);
    const p2 = polar(cx, cy, rOuter, a2);
    const p3 = polar(cx, cy, rInner, a2);
    const p4 = polar(cx, cy, rInner, a1);
    return [
      'M', p1.x, p1.y,
      'A', rOuter, rOuter, 0, largeArc, 1, p2.x, p2.y,
      'L', p3.x, p3.y,
      'A', rInner, rInner, 0, largeArc, 0, p4.x, p4.y,
      'Z'
    ].join(' ');
  }
  // Constrói o "d" de um evento: arcos principais por segmento + dentes
  // alternados (zigue-zague) nas fronteiras dia/noite para a transição ficar
  // visível. Um único <path> com múltiplos subpaths preenchidos pela mesma cor.
  function buildEventPathD(segments) {
    if (segments.length === 0) return '';
    const parts = [];

    // Arcos principais (faixa completa de cada segmento, no anel correspondente)
    segments.forEach(seg => {
      parts.push(ringSegmentPath(CX, CY, seg.rOuter, seg.rInner, seg.a1, seg.a2));
    });

    // Dentes de transição em cada fronteira entre segmentos consecutivos
    for (let i = 0; i < segments.length - 1; i++) {
      const segA = segments[i], segB = segments[i + 1];
      const boundary = segA.a2; // === segB.a1
      const spanA = segA.a2 - segA.a1;
      const spanB = segB.a2 - segB.a1;
      // Zona de transição: até 4° em cada lado, limitada por 1/4 do menor segmento
      const tw = Math.min(4, spanA / 4, spanB / 4);
      if (tw < 0.4) continue;

      const TEETH = 6; // dentes alternados entre os dois anéis
      const slotW = (2 * tw) / TEETH;
      for (let k = 0; k < TEETH; k++) {
        const a1 = (boundary - tw) + k * slotW;
        const a2 = a1 + slotW;
        const useSeg = (k % 2 === 0) ? segA : segB;
        parts.push(ringSegmentPath(CX, CY, useSeg.rOuter, useSeg.rInner, a1, a2));
      }
    }

    return parts.join(' ');
  }
  // Caminho de texto: arco do raio do meio do segmento, invertido na metade inferior
  function textArcPath(r, a1, a2) {
    let A1 = a1, A2 = a2, sweep = 1;
    const mid = ((A1 + A2) / 2 % 360 + 360) % 360;
    if (mid > 90 && mid < 270) { A1 = a2; A2 = a1; sweep = 0; }
    const arcSpan = Math.abs(A2 - A1);
    const largeArc = arcSpan > 180 ? 1 : 0;
    const p1 = polar(CX, CY, r, A1);
    const p2 = polar(CX, CY, r, A2);
    return ['M', p1.x, p1.y, 'A', r, r, 0, largeArc, sweep, p2.x, p2.y].join(' ');
  }

  // ---------- Estática ----------
  function buildRingBackgrounds() {
    ringBgsG.innerHTML = '';
    const day = document.createElementNS(SVG_NS, 'path');
    day.setAttribute('d', donutPath(CX, CY, DAY_RING.rMax, DAY_RING.rMin));
    day.setAttribute('class', 'ring-bg-day');
    day.setAttribute('fill-rule', 'evenodd');
    ringBgsG.appendChild(day);

    const night = document.createElementNS(SVG_NS, 'path');
    night.setAttribute('d', donutPath(CX, CY, NIGHT_RING.rMax, NIGHT_RING.rMin));
    night.setAttribute('class', 'ring-bg-night');
    night.setAttribute('fill-rule', 'evenodd');
    ringBgsG.appendChild(night);
  }

  function buildZoneIcons() {
    zoneIconsG.innerHTML = '';
    // Sol bem discreto no topo (12h = meio-dia visualmente) e lua na base (6h = meia-noite)
    const sun = document.createElementNS(SVG_NS, 'text');
    sun.setAttribute('x', CX);
    sun.setAttribute('y', CY - 33);
    sun.setAttribute('class', 'zone-icon');
    sun.textContent = '☀';
    zoneIconsG.appendChild(sun);

    const moon = document.createElementNS(SVG_NS, 'text');
    moon.setAttribute('x', CX);
    moon.setAttribute('y', CY + 4);
    moon.setAttribute('class', 'zone-icon');
    moon.textContent = '☾';
    zoneIconsG.appendChild(moon);
  }

  function buildTicksAndHours() {
    ticksG.innerHTML = '';
    hoursG.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const angle = i * 6;
      const major = i % 5 === 0;
      const r1 = major ? 44 : 45.4;
      const r2 = 47;
      const p1 = polar(CX, CY, r1, angle);
      const p2 = polar(CX, CY, r2, angle);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('class', major ? 'tick tick-major' : 'tick');
      line.setAttribute('stroke-width', major ? 0.45 : 0.2);
      ticksG.appendChild(line);
    }
    for (let h = 1; h <= 12; h++) {
      const angle = h * 30;
      const pos = polar(CX, CY, 42, angle);
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', pos.x); text.setAttribute('y', pos.y);
      const isMajor = (h % 3 === 0);
      text.setAttribute('class', 'hour-label' + (isMajor ? ' major' : ''));
      text.textContent = h;
      hoursG.appendChild(text);
    }
  }

  // ---------- Quebra de eventos em segmentos por anel ----------
  function splitByRing(startH, endH) {
    // Retorna [{ring, s, e}]; "day" = [6,18), "night" = [0,6) ∪ [18,24)
    const segs = [];
    let cur = startH;
    while (cur < endH) {
      const inDay = (cur >= 6 && cur < 18);
      let next;
      if (inDay) next = Math.min(18, endH);
      else if (cur < 6) next = Math.min(6, endH);
      else next = Math.min(24, endH);
      segs.push({ ring: inDay ? 'day' : 'night', s: cur, e: next });
      cur = next;
    }
    return segs;
  }

  // ---------- Alocação de tracks ----------
  function allocateTracks(prepared) {
    // prepared: [{ev, segments: [{ring, s, e}]}], já ordenado por startH
    const ringTimelines = { day: [], night: [] }; // tracks como arrays de "fim mais recente"
    prepared.forEach(item => {
      const ringsUsed = [...new Set(item.segments.map(s => s.ring))];
      let track = 0;
      while (true) {
        let ok = true;
        for (const ring of ringsUsed) {
          const segs = item.segments.filter(s => s.ring === ring);
          const earliest = Math.min(...segs.map(s => s.s));
          const lastEnd = ringTimelines[ring][track] !== undefined ? ringTimelines[ring][track] : -Infinity;
          if (lastEnd > earliest) { ok = false; break; }
        }
        if (ok) break;
        track++;
      }
      item.track = track;
      ringsUsed.forEach(ring => {
        const latest = Math.max(...item.segments.filter(s => s.ring === ring).map(s => s.e));
        ringTimelines[ring][track] = latest;
      });
    });
    return {
      dayCount:   Math.max(1, ringTimelines.day.length),
      nightCount: Math.max(1, ringTimelines.night.length)
    };
  }

  function trackRadii(ring, track, count) {
    const cfg = (ring === 'day') ? DAY_RING : NIGHT_RING;
    const total = cfg.rMax - cfg.rMin;
    const w = Math.min(MAX_TRACK_WIDTH, total / Math.max(count, 1));
    const rOuter = cfg.rMax - track * w;
    const rInner = rOuter - w + TRACK_GAP;
    return { rOuter, rInner };
  }

  // ---------- Render eventos ----------
  function renderEvents() {
    eventsG.innerHTML = '';
    textPathsG.innerHTML = '';
    const key = dateKey(viewDate);
    const dayEvents = events.filter(e => e.date === key);

    if (dayEvents.length === 0) {
      emptyHintEl.textContent = 'Toque em + para adicionar um evento';
      return;
    }
    emptyHintEl.textContent = dayEvents.length + (dayEvents.length === 1 ? ' evento' : ' eventos');

    const prepared = dayEvents.map(ev => {
      const startH = timeToHours(ev.start);
      const endH = timeToHours(ev.end);
      return { ev, startH, endH, segments: splitByRing(startH, endH) };
    }).filter(p => p.endH > p.startH);

    prepared.sort((a, b) => a.startH - b.startH);
    const { dayCount, nightCount } = allocateTracks(prepared);

    prepared.forEach(item => {
      // Atribui raios a cada segmento conforme o track e seu anel
      const segs = item.segments.map(s => {
        const [a1, a2] = hourSpanToAngles(s.s, s.e);
        const count = s.ring === 'day' ? dayCount : nightCount;
        const { rOuter, rInner } = trackRadii(s.ring, item.track, count);
        return { ring: s.ring, s: s.s, e: s.e, a1, a2, rOuter, rInner };
      });

      // Path do evento (com dentes em zigue-zague nas fronteiras dia/noite)
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', buildEventPathD(segs));
      path.setAttribute('fill', item.ev.color);
      path.setAttribute('class', 'event-arc');
      path.setAttribute('data-id', item.ev.id);
      path.addEventListener('click', () => openSheet(item.ev));
      eventsG.appendChild(path);

      // Texto circular no segmento mais longo (ângulo)
      const longest = segs.reduce((a, b) => (b.a2 - b.a1 > a.a2 - a.a1 ? b : a));
      const arcDeg = longest.a2 - longest.a1;
      const ringW  = longest.rOuter - longest.rInner;
      if (arcDeg >= 14 && ringW >= 3) {
        const midR = (longest.rOuter + longest.rInner) / 2;
        const pathId = 'tp-' + item.ev.id + '-' + longest.ring + '-' + item.track;
        const tp = document.createElementNS(SVG_NS, 'path');
        tp.setAttribute('id', pathId);
        tp.setAttribute('d', textArcPath(midR, longest.a1, longest.a2));
        tp.setAttribute('fill', 'none');
        textPathsG.appendChild(tp);

        const arcLengthPx = (Math.PI / 180) * arcDeg * midR;
        const maxChars = Math.max(2, Math.floor(arcLengthPx / 1.3));
        let title = item.ev.title || '';
        if (title.length > maxChars) title = title.slice(0, Math.max(1, maxChars - 1)) + '…';

        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('class', 'event-label');
        const textPath = document.createElementNS(SVG_NS, 'textPath');
        textPath.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#' + pathId);
        textPath.setAttribute('href', '#' + pathId);
        textPath.setAttribute('startOffset', '50%');
        textPath.setAttribute('text-anchor', 'middle');
        textPath.textContent = title;
        text.appendChild(textPath);
        eventsG.appendChild(text);
      }
    });
  }

  // ---------- Ponteiros ----------
  function setHand(el, angleDeg, length) {
    const p = polar(CX, CY, length, angleDeg);
    el.setAttribute('x2', p.x);
    el.setAttribute('y2', p.y);
  }
  function updateHands() {
    if (!isViewingToday()) {
      handHour.style.display = 'none';
      handMin.style.display = 'none';
      handSec.style.display = 'none';
      return;
    }
    const now = new Date();
    const h12 = (now.getHours() % 12) + now.getMinutes()/60 + now.getSeconds()/3600;
    const m   = now.getMinutes() + now.getSeconds()/60;
    const s   = now.getSeconds() + now.getMilliseconds()/1000;
    setHand(handHour, (h12 / 12) * 360, 21);
    setHand(handMin,  (m / 60) * 360, 28);
    setHand(handSec,  (s / 60) * 360, 30);
    handHour.style.display = '';
    handMin.style.display = '';
    handSec.style.display = '';
  }
  function updateTime() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    if (isViewingToday()) {
      timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    } else {
      timeEl.textContent = '--:--:--';
    }
    updateHands();
  }
  function updateHeader() {
    const d = viewDate.getDate();
    const m = MONTHS_PT[viewDate.getMonth()];
    const y = viewDate.getFullYear();
    dateMainEl.textContent = d + ' de ' + m + ' de ' + y;
    weekdayEl.textContent = WEEKDAYS_PT[viewDate.getDay()] + (isViewingToday() ? ' · HOJE' : '');
  }
  function render() {
    updateHeader();
    renderEvents();
    updateTime();
  }

  // ---------- Sheet ----------
  function buildColorGrid() {
    colorGrid.innerHTML = '';
    COLORS.forEach(c => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (c === selectedColor ? ' selected' : '');
      swatch.style.background = c;
      swatch.addEventListener('click', () => {
        selectedColor = c;
        [...colorGrid.children].forEach(el => el.classList.remove('selected'));
        swatch.classList.add('selected');
      });
      colorGrid.appendChild(swatch);
    });
  }
  function openSheet(existing) {
    if (existing) {
      editingId = existing.id;
      sheetTitle.textContent = 'Editar evento';
      evTitle.value = existing.title;
      evStart.value = existing.start;
      evEnd.value   = existing.end;
      selectedColor = existing.color;
      btnDelete.style.display = '';
    } else {
      editingId = null;
      sheetTitle.textContent = 'Novo evento';
      evTitle.value = '';
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const hh = isViewingToday() ? now.getHours() : 9;
      evStart.value = pad(hh) + ':00';
      evEnd.value   = pad(Math.min(hh + 1, 23)) + ':00';
      selectedColor = COLORS[Math.floor(Math.random() * COLORS.length)];
      btnDelete.style.display = 'none';
    }
    buildColorGrid();
    backdrop.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet() {
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
    editingId = null;
  }
  function saveEvent() {
    const title = (evTitle.value || '').trim();
    const start = evStart.value;
    const end   = evEnd.value;
    if (!title) { evTitle.focus(); return; }
    if (!start || !end) return;
    if (timeToHours(end) <= timeToHours(start)) {
      alert('O horário de fim deve ser maior que o de início.');
      return;
    }
    if (editingId) {
      const ev = events.find(x => x.id === editingId);
      if (ev) { ev.title = title; ev.start = start; ev.end = end; ev.color = selectedColor; }
    } else {
      events.push({
        id: String(Date.now()) + Math.random().toString(36).slice(2, 6),
        date: dateKey(viewDate),
        title, start, end, color: selectedColor
      });
    }
    saveEvents();
    closeSheet();
    render();
  }
  function deleteEvent() {
    if (!editingId) return;
    if (!confirm('Excluir este evento?')) return;
    events = events.filter(e => e.id !== editingId);
    saveEvents();
    closeSheet();
    render();
  }

  // ---------- Handlers ----------
  addBtn.addEventListener('click', () => openSheet(null));
  btnCancel.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  btnSave.addEventListener('click', saveEvent);
  btnDelete.addEventListener('click', deleteEvent);

  prevBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date(viewDate.getTime() - 86400000));
    render();
  });
  nextBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date(viewDate.getTime() + 86400000));
    render();
  });
  todayBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date());
    render();
  });

  // Swipe horizontal navega dia
  let tsX = null, tsY = null, tsTarget = null;
  const clockEl = document.querySelector('.clock');
  clockEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
    tsTarget = e.target;
  }, { passive: true });
  clockEl.addEventListener('touchend', (e) => {
    if (tsX === null) return;
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    const onArc = tsTarget && tsTarget.classList && tsTarget.classList.contains('event-arc');
    if (!onArc && Math.abs(dx) > 60 && Math.abs(dy) < 40) {
      if (dx < 0) nextBtn.click(); else prevBtn.click();
    }
    tsX = tsY = tsTarget = null;
  });

  // ---------- Bootstrap ----------
  buildRingBackgrounds();
  buildZoneIcons();
  buildTicksAndHours();
  render();

  setInterval(updateTime, 1000);
  setInterval(() => {
    const newToday = startOfDay(new Date());
    if (newToday.getTime() !== today.getTime()) {
      today.setTime(newToday.getTime());
      render();
    }
  }, 30000);
})();
</script>
</body>
</html>
