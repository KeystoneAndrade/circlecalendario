<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>Circle Calendário</title>
<style>
  :root {
    --bg: #0b0e14;
    --face: #11151d;
    --ring: #1f2633;
    --text: #e7ecf3;
    --muted: #7c8699;

    --madrugada: #2a3a6b;
    --manha:     #f0b259;
    --tarde:     #e76f51;
    --noite:     #4a3b7a;

    --hand-hour:   #ffffff;
    --hand-minute: #c9d2e0;
    --hand-second: #ff5d73;

    --shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #141a26 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
    min-height: 100svh;
  }

  header {
    width: 100%;
    padding: 18px 20px 6px;
    text-align: center;
    flex-shrink: 0;
  }

  .date-main {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .weekday {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    min-height: 0;
  }

  .clock {
    width: min(92vw, 92svh, 560px);
    aspect-ratio: 1 / 1;
    position: relative;
    filter: drop-shadow(var(--shadow));
    touch-action: manipulation;
  }

  svg.clock-face {
    width: 100%;
    height: 100%;
    display: block;
  }

  .hour-label {
    font-size: 4.2px;
    fill: var(--text);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 600;
  }
  .hour-label.major { font-size: 5.4px; }

  .period-label {
    font-size: 3.4px;
    fill: rgba(255, 255, 255, 0.85);
    text-anchor: middle;
    dominant-baseline: middle;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }

  .tick { stroke: rgba(255, 255, 255, 0.35); }
  .tick-major { stroke: rgba(255, 255, 255, 0.7); }

  .hand-hour   { stroke: var(--hand-hour);   stroke-linecap: round; }
  .hand-minute { stroke: var(--hand-minute); stroke-linecap: round; }
  .hand-second { stroke: var(--hand-second); stroke-linecap: round; }

  .center-dot  { fill: var(--text); }
  .center-ring { fill: none; stroke: var(--ring); }

  .now-marker { fill: var(--hand-second); }

  footer {
    width: 100%;
    padding: 8px 20px 18px;
    text-align: center;
    flex-shrink: 0;
  }

  .time-display {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }

  .period-now {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .controls button {
    background: #161b25;
    color: var(--text);
    border: 1px solid var(--ring);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    min-width: 44px;
    min-height: 36px;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .controls button:active { background: var(--ring); transform: scale(0.97); }
  .controls .today-btn { color: var(--manha); border-color: var(--manha); background: transparent; }

  @media (max-height: 640px) {
    header { padding: 10px 20px 2px; }
    .date-main { font-size: 18px; }
    .weekday { font-size: 11px; margin-top: 2px; }
    footer { padding: 4px 20px 10px; }
    .time-display { font-size: 22px; }
    .clock { width: min(85vw, 80svh, 420px); }
  }
</style>
</head>
<body>
  <header>
    <div class="date-main" id="dateMain">—</div>
    <div class="weekday" id="weekday">—</div>
  </header>

  <main>
    <div class="clock">
      <svg class="clock-face" viewBox="0 0 100 100" id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%"  stop-color="#1c2330"/>
            <stop offset="100%" stop-color="#0e131c"/>
          </radialGradient>
        </defs>

        <circle cx="50" cy="50" r="49" fill="url(#faceGrad)" stroke="#1f2633" stroke-width="0.4"/>

        <g id="zones"></g>

        <circle cx="50" cy="50" r="36" fill="url(#faceGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="0.3"/>

        <g id="periodLabels"></g>
        <g id="ticks"></g>
        <g id="hourLabels"></g>

        <circle id="nowMarker" class="now-marker" cx="50" cy="50" r="0.9"/>

        <line id="handHour"   class="hand-hour"   x1="50" y1="50" x2="50" y2="50" stroke-width="1.6"/>
        <line id="handMinute" class="hand-minute" x1="50" y1="50" x2="50" y2="50" stroke-width="1.0"/>
        <line id="handSecond" class="hand-second" x1="50" y1="50" x2="50" y2="50" stroke-width="0.4"/>

        <circle class="center-ring" cx="50" cy="50" r="2.2" stroke-width="0.5"/>
        <circle class="center-dot"  cx="50" cy="50" r="1.1"/>
      </svg>
    </div>
  </main>

  <footer>
    <div class="time-display" id="timeDisplay">--:--:--</div>
    <div class="period-now" id="periodNow">—</div>
    <div class="controls">
      <button id="prevBtn" aria-label="Dia anterior">‹</button>
      <button class="today-btn" id="todayBtn">Hoje</button>
      <button id="nextBtn" aria-label="Próximo dia">›</button>
    </div>
  </footer>

<script>
(function () {
  'use strict';

  const WEEKDAYS_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const MONTHS_PT  = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  // Faixas do dia (em horas decimais 0..24)
  const PERIODS = [
    { name: 'Madrugada', start:  0, end:  6, color: 'var(--madrugada)' },
    { name: 'Manhã',     start:  6, end: 12, color: 'var(--manha)' },
    { name: 'Tarde',     start: 12, end: 18, color: 'var(--tarde)' },
    { name: 'Noite',     start: 18, end: 24, color: 'var(--noite)' },
  ];

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CX = 50, CY = 50;

  const zonesG    = document.getElementById('zones');
  const ticksG    = document.getElementById('ticks');
  const hoursG    = document.getElementById('hourLabels');
  const periodsG  = document.getElementById('periodLabels');

  const handHour   = document.getElementById('handHour');
  const handMin    = document.getElementById('handMinute');
  const handSec    = document.getElementById('handSecond');
  const nowMarker  = document.getElementById('nowMarker');

  const dateMainEl = document.getElementById('dateMain');
  const weekdayEl  = document.getElementById('weekday');
  const timeEl     = document.getElementById('timeDisplay');
  const periodNowEl= document.getElementById('periodNow');

  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const todayBtn = document.getElementById('todayBtn');

  // Estado: dia exibido (00:00 daquele dia)
  const today = startOfDay(new Date());
  let viewDate = new Date(today.getTime());

  function startOfDay(d) {
    const x = new Date(d.getTime());
    x.setHours(0, 0, 0, 0);
    return x;
  }

  // Em um relógio de 24h: hora 0 (meia-noite) no topo, 12 (meio-dia) embaixo.
  // Ângulo em graus a partir de "12 horas" (topo), aumentando no sentido horário.
  function hourToAngle(hour) {
    return (hour / 24) * 360;
  }

  function polar(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }

  function arcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
    const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
    const p1 = polar(cx, cy, rOuter, startAngle);
    const p2 = polar(cx, cy, rOuter, endAngle);
    const p3 = polar(cx, cy, rInner, endAngle);
    const p4 = polar(cx, cy, rInner, startAngle);
    return [
      'M', p1.x, p1.y,
      'A', rOuter, rOuter, 0, largeArc, 1, p2.x, p2.y,
      'L', p3.x, p3.y,
      'A', rInner, rInner, 0, largeArc, 0, p4.x, p4.y,
      'Z'
    ].join(' ');
  }

  function buildZones() {
    zonesG.innerHTML = '';
    const rOuter = 48;
    const rInner = 36;
    PERIODS.forEach(p => {
      const a1 = hourToAngle(p.start);
      const a2 = hourToAngle(p.end);
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', arcPath(CX, CY, rOuter, rInner, a1, a2));
      path.setAttribute('fill', p.color);
      path.setAttribute('opacity', '0.78');
      zonesG.appendChild(path);
    });
  }

  function buildPeriodLabels() {
    periodsG.innerHTML = '';
    const rLabel = 42;
    PERIODS.forEach(p => {
      const mid = (p.start + p.end) / 2;
      const pos = polar(CX, CY, rLabel, hourToAngle(mid));
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', pos.x);
      text.setAttribute('y', pos.y);
      text.setAttribute('class', 'period-label');
      text.textContent = p.name;
      periodsG.appendChild(text);
    });
  }

  function buildTicksAndHours() {
    ticksG.innerHTML = '';
    hoursG.innerHTML = '';

    // 48 traços (cada 30 min) — major a cada hora
    for (let i = 0; i < 48; i++) {
      const angle = (i / 48) * 360;
      const major = i % 2 === 0;
      const r1 = major ? 33.5 : 34.4;
      const r2 = 35.6;
      const p1 = polar(CX, CY, r1, angle);
      const p2 = polar(CX, CY, r2, angle);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', p1.x);
      line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x);
      line.setAttribute('y2', p2.y);
      line.setAttribute('class', major ? 'tick tick-major' : 'tick');
      line.setAttribute('stroke-width', major ? 0.45 : 0.2);
      ticksG.appendChild(line);
    }

    // Números das horas a cada 3h (0, 3, 6, 9, 12, 15, 18, 21)
    for (let h = 0; h < 24; h++) {
      if (h % 3 !== 0) continue;
      const pos = polar(CX, CY, 30.5, hourToAngle(h));
      const text = document.createElementNS(SVG_NS, 'text');
      text.setAttribute('x', pos.x);
      text.setAttribute('y', pos.y);
      const isMajor = (h % 6 === 0);
      text.setAttribute('class', 'hour-label' + (isMajor ? ' major' : ''));
      text.textContent = String(h).padStart(2, '0');
      hoursG.appendChild(text);
    }
  }

  function setHand(el, angleDeg, length) {
    const p = polar(CX, CY, length, angleDeg);
    el.setAttribute('x2', p.x);
    el.setAttribute('y2', p.y);
  }

  function currentPeriodName(hourDecimal) {
    for (const p of PERIODS) {
      if (hourDecimal >= p.start && hourDecimal < p.end) return p.name;
    }
    return 'Madrugada';
  }

  function isViewingToday() {
    return viewDate.getTime() === today.getTime();
  }

  function updateHands() {
    const now = new Date();
    const viewingToday = isViewingToday();

    if (viewingToday) {
      const h = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
      const m = now.getMinutes() + now.getSeconds()/60;
      const s = now.getSeconds() + now.getMilliseconds()/1000;

      setHand(handHour, hourToAngle(h), 22);
      setHand(handMin,  (m / 60) * 360, 30);
      setHand(handSec,  (s / 60) * 360, 33);

      const mark = polar(CX, CY, 33, hourToAngle(h));
      nowMarker.setAttribute('cx', mark.x);
      nowMarker.setAttribute('cy', mark.y);

      handHour.style.display = '';
      handMin.style.display = '';
      handSec.style.display = '';
      nowMarker.style.display = '';
    } else {
      handHour.style.display = 'none';
      handMin.style.display = 'none';
      handSec.style.display = 'none';
      nowMarker.style.display = 'none';
    }
  }

  function updateClock() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');

    if (isViewingToday()) {
      timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      const h = now.getHours() + now.getMinutes()/60;
      periodNowEl.textContent = currentPeriodName(h);
    } else {
      timeEl.textContent = '--:--:--';
      periodNowEl.textContent = 'Outro dia';
    }
    updateHands();
  }

  function updateHeader() {
    const d = viewDate.getDate();
    const m = MONTHS_PT[viewDate.getMonth()];
    const y = viewDate.getFullYear();
    dateMainEl.textContent = d + ' de ' + m + ' de ' + y;
    weekdayEl.textContent = WEEKDAYS_PT[viewDate.getDay()] + (isViewingToday() ? ' · HOJE' : '');
  }

  function render() {
    updateHeader();
    updateClock();
  }

  prevBtn.addEventListener('click', () => {
    viewDate = new Date(viewDate.getTime() - 86400000);
    viewDate = startOfDay(viewDate);
    render();
  });
  nextBtn.addEventListener('click', () => {
    viewDate = new Date(viewDate.getTime() + 86400000);
    viewDate = startOfDay(viewDate);
    render();
  });
  todayBtn.addEventListener('click', () => {
    viewDate = startOfDay(new Date());
    render();
  });

  // Swipe horizontal navega entre dias
  let touchStartX = null;
  const clockEl = document.querySelector('.clock');
  clockEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) touchStartX = e.touches[0].clientX;
  }, { passive: true });
  clockEl.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) nextBtn.click(); else prevBtn.click();
    }
    touchStartX = null;
  });

  buildZones();
  buildPeriodLabels();
  buildTicksAndHours();
  render();

  // Atualiza ponteiros e relógio a cada segundo
  setInterval(updateClock, 1000);

  // Detecta virada de dia
  setInterval(() => {
    const newToday = startOfDay(new Date());
    if (newToday.getTime() !== today.getTime()) {
      today.setTime(newToday.getTime());
      if (isViewingToday()) render();
    }
  }, 30000);
})();
</script>
</body>
</html>
